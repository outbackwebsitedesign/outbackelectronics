<script>
(function () {
  function check() {
    fetch('/api/maintenance-status')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.enabled) {
          var from = encodeURIComponent(window.location.pathname + window.location.search);

        }
      })
      .catch(function () {});
  }
  setInterval(check, 5000);
}());

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outback Electronics — Admin Login</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4ede1;
      --bg-elev: #faf6ec;
      --bg-deep: #e9dfc9;
      --ink: #1f1a14;
      --ink-2: #5a4f40;
      --ink-3: #8b7e69;
      --ink-on-dark: #f4ede1;
      --dark: #1f1a14;
      --rust: #b5451b;
      --rust-deep: #923a14;
      --sky: #1f88f5;
      --ochre: #d39a37;
      --eucalyptus: #4f6b3e;
      --line: #d8cdb6;
      --line-strong: #b9ac8d;
      --paper: #fbf7ed;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body { font-family: 'Archivo', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .logo-mark { border: 1px solid #2a241c; display: inline-flex; align-items: center; justify-content: center; }
    .logo-mark.sm { width: 40px; height: 40px; }
    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    .label { font-size: 12px; color: var(--ink-3); }
    .input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .input:focus { outline: 2px solid var(--rust); outline-offset: 1px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 0;
      border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
      font-weight: 600; font-size: 13px; letter-spacing: 0.02em; cursor: pointer;
    }
    .btn-rust { background: var(--rust); border-color: var(--rust); color: var(--paper); }
    .btn-rust:hover { background: var(--rust-deep); border-color: var(--rust-deep); }
  </style>
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <div id="root"></div>

  <script type="module" src="/src/admin-entry.jsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fire — Outback Electronics</title>
<meta name="description" content="Live bushfire incidents and alert levels for every Australian state, with links to official fire-ban and road-closure sources. Stay aware out bush." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Base + shared shell come from app-shell.css. Fire-specific layout only. */
  .fire-controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .fire-state-select { display: flex; align-items: center; gap: 10px; }
  .fire-state-select label { font-size: 12px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); white-space: nowrap; }
  .fire-state-select select { background: var(--bg-elev); border: 1px solid var(--line-strong); color: var(--ink); padding: 6px 10px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .fire-alerts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 700px) { .fire-alerts { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 400px) { .fire-alerts { grid-template-columns: 1fr; } }
  .fire-alert { padding: 18px; border: 1px solid var(--line); background: var(--bg-elev); }
  .fire-alert b { font-size: 34px; font-weight: 700; display: block; }
  .fire-alert span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace; color: var(--ink-2); }
  .fire-alert.emergency { box-shadow: inset 4px 0 0 #b3231b; }
  .fire-alert.watch { box-shadow: inset 4px 0 0 var(--rust); }
  .fire-alert.advice { box-shadow: inset 4px 0 0 var(--ochre); }
  .fire-note { font-size: 12px; color: var(--ink-3); margin: 0 0 18px; }
  .fire-list { border-top: 1px solid var(--line); }
  .fire-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .fire-item .t { font-size: 14px; }
  .fire-item-type { font-size: 11px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace; }
  .fire-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border: 1px solid var(--line-strong); white-space: nowrap; color: var(--ink-2); }
  .badge-emergency { background: #fdeceb; border-color: #e7a9a3; color: #8f1c14; }
  .badge-watch { background: #fbe9df; border-color: #e6b79b; color: #8a3411; }
  .badge-advice { background: #fbf2dd; border-color: #e6cf95; color: #7a5b14; }
  .badge-information { background: #e8f0f6; border-color: #a0bcce; color: #2d5670; }
  .fire-map { height: 420px; min-height: 280px; margin: 20px 0; border: 1px solid var(--line); z-index: 1; background: var(--bg-deep); }
  @media (max-width: 600px) { .fire-map { height: 300px; } }
  .fire-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/fire-entry.jsx"></script>
</body>
</html>

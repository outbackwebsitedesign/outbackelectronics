<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coverage — Outback Electronics</title>
<meta name="description" content="A crowd-sourced mobile and satellite signal map for remote Australia. Drop a report where you got reception and help the next traveller." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Base + shared shell come from app-shell.css. Coverage-specific layout only. */
  .cov-wrap { display: grid; grid-template-columns: 340px 1fr; align-items: stretch; }
  @media (max-width: 760px) { .cov-wrap { grid-template-columns: 1fr; } }
  .cov-side { padding: 18px; background: var(--bg-elev); border-right: 1px solid var(--line); max-height: 76vh; overflow-y: auto; }
  @media (max-width: 760px) { .cov-side { max-height: none; border-right: none; border-bottom: 1px solid var(--line); } }
  #covmap { height: 76vh; min-height: 380px; z-index: 1; background: var(--bg-deep); }
  @media (max-width: 760px) { #covmap { height: 52vh; } }
  .cov-side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; font-family: 'JetBrains Mono', monospace; color: var(--ink-2); margin: 0 0 12px; }
  .cov-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .cov-chip { font-size: 11px; padding: 4px 9px; border: 1px solid var(--line-strong); cursor: pointer; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; user-select: none; }
  .cov-chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cov-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2); margin-bottom: 16px; }
  .cov-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .cov-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .cov-form { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
  .cov-hint { font-size: 12px; color: var(--ink-3); margin: 10px 0; }
  .cov-msg { font-size: 13px; color: var(--eucalyptus); font-weight: 600; min-height: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/coverage-entry.jsx"></script>
</body>
</html>

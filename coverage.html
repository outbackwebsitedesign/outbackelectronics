<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coverage — Outback Electronics</title>
<meta name="description" content="Check Telstra, Optus, and Vodafone mobile coverage across Australia before your next trip into the outback." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  .cov-wrap { display: flex; flex-direction: column; }
  .cov-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bg-elev); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .cov-bar-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; color: var(--ink-2); white-space: nowrap; }
  .cov-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cov-chip { font-size: 12px; padding: 5px 12px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); cursor: pointer; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; transition: background 0.15s, color 0.15s; }
  .cov-chip.on { color: #fff; }
  .cov-chip-wrap { position: relative; }
  .cov-tooltip { position: absolute; top: calc(100% + 6px); left: 0; background: var(--ink); color: var(--paper); font-size: 11px; padding: 5px 9px; white-space: nowrap; z-index: 999; pointer-events: none; font-family: 'JetBrains Mono', monospace; }
  .cov-chip-starlink { text-decoration: none; color: var(--ink); border-style: dashed; }
  .cov-chip-starlink:hover { background: var(--bg-deep); }
  .cov-source { margin-left: auto; font-size: 12px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace; }
  .cov-source a { color: inherit; }
  #covmap { height: calc(100vh - 56px - 49px); min-height: 400px; z-index: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/coverage-entry.jsx"></script>
</body>
</html>

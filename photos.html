<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Photos - Outback Electronics</title>
<meta name="description" content="Back up and browse your photos on the Outback Electronics server. Your shots, your server." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Base + shared shell come from app-shell.css. Photos-specific layout only. */
  .ph-actions { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .ph-msg { font-size: 13px; color: var(--ink-3); }
  .ph-empty { color: var(--ink-3); }
  .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .ph-thumb { padding: 0; border: 1px solid var(--line); background: var(--bg-deep); cursor: pointer; aspect-ratio: 1; overflow: hidden; }
  .ph-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 200ms ease; }
  .ph-thumb:hover img { transform: scale(1.05); }
  .ph-lightbox { position: fixed; inset: 0; background: rgba(20,16,12,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 200; padding: 24px; }
  .ph-lightbox img { max-width: 92vw; max-height: 80vh; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .ph-lb-bar { display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/photos-entry.jsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Swap &amp; Sell - Outback Electronics</title>
<meta name="description" content="The community noticeboard for remote Australia, gear, parts, vehicles, wanted ads and free stuff. Free to post for members." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Base + shared shell come from app-shell.css. Swap-specific layout only. */
  .swap-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .swap-cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 4px 10px; border: 1px solid var(--line-strong); cursor: pointer; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; user-select: none; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .swap-msg { font-size: 13px; color: var(--eucalyptus); font-weight: 600; min-height: 18px; margin: 6px 0; }
  .swap-empty { color: var(--ink-3); }
  .swap-form { background: var(--bg-elev); border: 1px solid var(--line); padding: 20px; margin-bottom: 24px; }
  .swap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .swap-card { background: var(--bg-elev); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .swap-img { aspect-ratio: 4/3; overflow: hidden; background: var(--bg-deep); }
  .swap-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .swap-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .swap-cat { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--rust); }
  .swap-title { font-size: 17px; }
  .swap-desc { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
  .swap-meta { font-size: 12px; color: var(--ink-3); }
  .swap-contact { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/swap-entry.jsx"></script>
</body>
</html>

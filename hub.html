<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outback Hub — Outback Electronics</title>
<meta name="description" content="Your home base for everything Outback Electronics — files, photos, radio, weather, sky, maps, off-grid tools and your account, all in one place." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4ede1; --bg-elev: #faf6ec; --bg-deep: #e9dfc9;
    --ink: #1f1a14; --ink-2: #5a4f40; --ink-3: #6f6350;
    --sand-dim: #9c8f78;
    --rust: #1f88f5; --rust-deep: #1668c8;
    --ochre: #d39a37; --eucalyptus: #4f6b3e;
    --line: #d8cdb6; --line-strong: #b9ac8d;
    --paper: #fbf7ed; --ink-on-dark: #f4ede1; --dark: #1f1a14;
    --shadow: 0 1px 0 rgba(31,26,20,0.05), 0 8px 24px -12px rgba(31,26,20,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); height: 100%; }
  body { font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
  #root { display: flex; flex-direction: column; flex: 1; }
  h1, h2, h3, h4, h5 { margin: 0; font-weight: 600; line-height: 1.1; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; cursor: pointer; transition: background 120ms ease; font-family: inherit; }
  .btn:hover { background: var(--rust); border-color: var(--rust); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--bg); }
  .btn-rust { background: var(--rust); border-color: var(--rust); color: #fff; }
  .btn-rust:hover { background: var(--rust-deep); border-color: var(--rust-deep); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .topnav { background: var(--dark); border-bottom: 1px solid #2a241c; }
  .topnav .inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo-mark { background: var(--ochre); padding: 5px 9px; display: grid; place-items: center; height: 44px; }
  .logo-mark img { height: 32px; display: block; }
  .logo-text .name { font-weight: 700; font-size: 15px; color: var(--bg-deep); }
  .logo-text .sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.18em; color: var(--sand-dim); text-transform: uppercase; margin-top: 3px; }
  .nav-right { display: flex; align-items: center; gap: 12px; color: var(--sand-dim); font-size: 13px; }
  .footer { background: var(--dark); color: var(--sand-dim); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; padding: 18px 0; margin-top: auto; }
  .footer .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .footer a { color: var(--sand-dim); }
  .footer a:hover { color: var(--ochre); }

  /* ── Hub-specific ─────────────────────────────────────────────────────── */
  .oe-ann { background: var(--ochre); color: #241c0c; font-size: 13px; font-weight: 600; padding: 8px 0; text-align: center; }
  .hub-main { padding: 36px 24px 64px; }
  .hub-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .hub-title { font-size: clamp(32px, 5vw, 52px); margin: 6px 0 12px; }
  .hub-sub { color: var(--ink-2); max-width: 54ch; }
  .hub-hero-side { display: flex; align-items: center; gap: 12px; }
  .hub-chip { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); background: var(--bg-elev); padding: 10px 14px; }
  .hub-chip-glyph { font-size: 22px; }
  .hub-chip b { display: block; font-size: 18px; }
  .hub-chip small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); font-family: 'JetBrains Mono', monospace; }
  .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 44px; }
  .hub-card { display: flex; flex-direction: column; gap: 6px; padding: 20px 16px; background: var(--bg-elev); border: 1px solid var(--line); transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease; }
  .hub-card:hover { transform: translateY(-2px); border-color: var(--ochre); box-shadow: var(--shadow); }
  .hub-card-glyph { font-size: 30px; line-height: 1; }
  .hub-card-label { font-weight: 700; font-size: 16px; }
  .hub-card-tag { font-size: 12px; color: var(--ink-3); }
  .hub-snapshot { border-top: 1px solid var(--line); padding-top: 24px; }
  .hub-h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); font-family: 'JetBrains Mono', monospace; margin-bottom: 14px; }
  .hub-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .hub-stat { background: var(--bg-elev); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 4px; transition: border-color 120ms; }
  .hub-stat:hover { border-color: var(--ochre); }
  .hub-stat b { font-size: 30px; font-weight: 700; }
  .hub-stat span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
  @media (max-width: 600px) { .container { padding: 0 16px; } .hub-main { padding: 24px 16px 48px; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/hub-entry.jsx"></script>
</body>
</html>

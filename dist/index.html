<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outback Electronics — Built for where the signal ends</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4ede1;
    --bg-elev: #faf6ec;
    --bg-deep: #e9dfc9;
    --ink: #1f1a14;
    --ink-2: #5a4f40;
    --ink-3: #8b7e69;
    --rust: #1f88f5;
    --rust-deep: #1668c8;
    --ochre: #d39a37;
    --eucalyptus: #4f6b3e;
    --sky: #1f88f5;
    --line: #d8cdb6;
    --line-strong: #b9ac8d;
    --paper: #fbf7ed;
    --ink-on-dark: #f4ede1;
    --dark: #1f1a14;
    --shadow: 0 1px 0 rgba(31,26,20,0.05), 0 8px 24px -12px rgba(31,26,20,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, h5 { margin: 0; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.005em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .italic { font-style: italic; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .rule { height: 1px; background: var(--line); width: 100%; }
  .rule-double { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); height: 4px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 0;
    border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
    font-weight: 600; font-size: 13px; letter-spacing: 0.02em;
    cursor: pointer; transition: transform 80ms ease, background 120ms ease;
  }
  .btn:hover { background: var(--rust); border-color: var(--rust); }
  .btn:active { transform: translateY(1px); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--bg); }
  .btn-rust { background: var(--rust); border-color: var(--rust); color: var(--paper); }
  .btn-rust:hover { background: var(--rust-deep); border-color: var(--rust-deep); }
  .btn-sm { padding: 6px 10px; font-size: 11px; }

  /* Cards */
  .card { background: var(--bg-elev); border: 1px solid var(--line); }
  .card-paper { background: var(--paper); border: 1px solid var(--line); }

  /* Inputs */
  .input, .textarea, .select {
    width: 100%;
    padding: 11px 12px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    border-radius: 0;
    outline: none;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--ink); }
  .textarea { resize: vertical; min-height: 110px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > .label {
    display: block; margin-bottom: 6px;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace; color: var(--ink-2);
  }

  /* Tags */
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border: 1px solid var(--line-strong);
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--bg-elev); color: var(--ink-2);
  }
  .tag-rust { background: var(--rust); color: var(--paper); border-color: var(--rust); }
  .tag-ochre { background: var(--ochre); color: var(--dark); border-color: var(--ochre); }
  .tag-euc { background: var(--eucalyptus); color: var(--paper); border-color: var(--eucalyptus); }
  .tag-ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tag-outline { background: transparent; }

  /* Image slot — striped placeholder */
  .slot {
    background:
      repeating-linear-gradient(135deg, rgba(31,26,20,0.05) 0 12px, transparent 12px 24px),
      var(--bg-deep);
    border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    text-align: center; padding: 12px;
  }
  .slot-rust {
    background:
      repeating-linear-gradient(135deg, rgba(31,136,245,0.15) 0 12px, transparent 12px 24px),
      var(--bg-deep);
  }
  .slot-dark {
    background:
      repeating-linear-gradient(135deg, rgba(244,237,225,0.07) 0 12px, transparent 12px 24px),
      #2a241c;
    color: var(--bg-deep);
    border-color: #2a241c;
  }

  /* Layout */
  .container { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 32px; }

  /* Nav */
  .utility-bar {
    background: var(--ink); color: var(--bg-deep);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.06em; padding: 8px 0;
  }
  .utility-bar a { color: inherit; }
  .utility-bar a:hover { color: var(--ochre); }
  .utility-bar .container { display: flex; justify-content: space-between; gap: 24px; align-items: center; }
  .utility-bar .links { display: flex; gap: 18px; flex-wrap: wrap; }

  .topnav { background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
  .topnav .row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 24px; }
  .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .logo-mark {
    background: #000;
    padding: 6px 10px;
    display: grid; place-items: center;
    height: 52px;
  }
  .logo-mark img { height: 40px; display: block; }
  .logo-mark.sm { height: 40px; padding: 4px 8px; }
  .logo-mark.sm img { height: 28px; }
  .logo-text { line-height: 1; }
  .logo-text .sub { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-2); text-transform: uppercase; margin-top: 4px;}

  .mainlinks { display: flex; gap: 4px; }
  .mainlinks a {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .mainlinks a:hover { color: var(--rust); }
  .mainlinks a.active { border-bottom-color: var(--rust); color: var(--rust); }

  .topnav-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: 1px solid var(--line-strong); background: var(--bg-elev);
    cursor: pointer;
    color: var(--ink);
  }
  .icon-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cart-count {
    position: absolute; transform: translate(11px,-11px);
    background: var(--rust); color: var(--paper);
    border-radius: 999px; min-width: 16px; height: 16px;
    font-size: 10px; font-weight: 700;
    display: grid; place-items: center; padding: 0 4px;
  }

  /* page header */
  .page-head {
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
    padding: 36px 0 28px;
  }
  .page-head .crumbs { display: flex; gap: 8px; align-items: center; }
  .page-head h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 64px; margin-top: 14px; }
  .page-head .lead { max-width: 640px; margin-top: 10px; color: var(--ink-2); font-size: 16px; }

  /* footer */
  footer { background: var(--ink); color: var(--bg-deep); margin-top: 80px; padding: 60px 0 24px;}
  footer a:hover { color: var(--ochre); }
  footer .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 32px; }
  footer h5 { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ochre); margin-bottom: 14px; font-weight: 500;}
  footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 13px; }
  footer .baseline { margin-top: 48px; padding-top: 20px; border-top: 1px solid #3a3127; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); }

  /* utilities */
  .stack { display: grid; gap: 16px; }
  .row-flex { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .price { font-family: 'Instrument Serif', serif; font-size: 24px; }
  .price-strike { text-decoration: line-through; color: var(--ink-3); font-size: 14px; }

  /* product cards */
  .product {
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: transform 120ms ease, box-shadow 120ms ease;
    cursor: pointer;
  }
  .product:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .product .slot { aspect-ratio: 4/3; }
  .product .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
  .product .body .name { font-weight: 600; font-size: 14px; }
  .product .body .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; }
  .product .body .row-px { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; }

  /* dot list */
  .checks { display: grid; gap: 10px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; }
  .checks li::before { content: '+'; font-family: 'JetBrains Mono', monospace; color: var(--rust); font-weight: 700; }

  ul.bullets { padding-left: 18px; margin: 0; }
  ul.bullets li { margin-bottom: 6px; }

  hr.thin { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

  /* tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 10px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { border-bottom-color: var(--rust); color: var(--rust); }

  /* badges */
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* select native styling */
  .select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

  /* hide scrollbar in horizontal scrollers */
  .hscroll { overflow-x: auto; }
  .hscroll::-webkit-scrollbar { height: 6px; }
  .hscroll::-webkit-scrollbar-thumb { background: var(--line-strong); }

  /* announcement */
  .announce { background: var(--ochre); color: var(--dark); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-align: center; padding: 8px 0; }

  /* AI: terminal */
  .term { background: #181410; color: #f4ede1; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 18px 20px; border: 1px solid #2a241c; }
  .term .prompt { color: var(--ochre); }
  .term .ok { color: #8db974; }
  .term .warn { color: #d39a37; }

  /* Forum */
  .thread { display: grid; grid-template-columns: 56px 1fr 120px 120px; gap: 16px; padding: 16px 12px; border-top: 1px solid var(--line); align-items: center; }
  .thread:hover { background: var(--bg-elev); }
  .avatar { width: 40px; height: 40px; background: var(--rust); color: var(--paper); display: grid; place-items: center; font-family: 'Instrument Serif', serif; font-size: 18px; }

  /* groups card */
  .group-card { display: flex; gap: 16px; padding: 18px; background: var(--paper); border: 1px solid var(--line); }

  /* policies sidebar */
  .policy-layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; }
  .policy-nav a { display: block; padding: 8px 10px; font-size: 13px; border-left: 2px solid transparent; cursor: pointer; }
  .policy-nav a.active { border-left-color: var(--rust); color: var(--rust); font-weight: 600; }
  .policy-nav a:hover { background: var(--bg-elev); }
  .policy-content h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; margin-bottom: 12px; }
  .policy-content h3 { font-size: 14px; margin: 18px 0 6px; }
  .policy-content p { margin-bottom: 10px; color: var(--ink-2); font-size: 14px; }

  /* notice strip */
  .notice {
    background: var(--bg-deep); border: 1px solid var(--line-strong); padding: 14px 16px;
    display: flex; gap: 14px; align-items: center;
  }

  /* hamburger hidden on desktop; mobile.css shows it */
  .hamburger { display: none; }
  .mobile-nav { display: none; }

  /* responsive niceties */
  @media (max-width: 1100px) {
    .mainlinks { gap: 0; flex-wrap: wrap; }
    .mainlinks a { padding: 6px 10px; font-size: 12px; }
    footer .grid { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr 1fr; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 0.3; }
  }
</style>

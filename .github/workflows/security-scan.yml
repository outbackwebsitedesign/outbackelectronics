name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        id: npm_audit
        run: |
          npm audit --json > /tmp/audit.json 2>/dev/null || true
          echo "done"

      - name: Run Semgrep
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/nodejs
            p/secrets
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Generate security-overview.md
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT=$(git rev-parse --short HEAD)

          # --- npm audit summary ---
          if [ -f /tmp/audit.json ]; then
            TOTAL=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('total',0))" 2>/dev/null || echo "unknown")
            CRITICAL=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))" 2>/dev/null || echo "0")
            HIGH=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0))" 2>/dev/null || echo "0")
            MODERATE=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('moderate',0))" 2>/dev/null || echo "0")
            LOW_V=$(cat /tmp/audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('low',0))" 2>/dev/null || echo "0")

            AUDIT_DETAILS=$(cat /tmp/audit.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          vulns = d.get('vulnerabilities', {})
          lines = []
          for name, info in vulns.items():
              sev = info.get('severity','unknown')
              via = info.get('via', [])
              titles = [v.get('title','') if isinstance(v, dict) else str(v) for v in via]
              title = titles[0] if titles else 'dependency issue'
              lines.append(f'- **{sev.upper()}** \`{name}\`: {title}')
          print('\n'.join(lines) if lines else '- No vulnerable packages found')
          " 2>/dev/null || echo "- Could not parse audit output")
          else
            TOTAL=0; CRITICAL=0; HIGH=0; MODERATE=0; LOW_V=0
            AUDIT_DETAILS="- npm audit output not available"
          fi

          # --- Semgrep summary ---
          if [ -f results.sarif ]; then
            SEMGREP_COUNT=$(cat results.sarif | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          runs = d.get('runs', [])
          total = sum(len(r.get('results', [])) for r in runs)
          print(total)
          " 2>/dev/null || echo "0")

            SEMGREP_DETAILS=$(cat results.sarif | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          lines = []
          for run in d.get('runs', []):
              rules = {r['id']: r for r in run.get('tool', {}).get('driver', {}).get('rules', [])}
              for result in run.get('results', []):
                  rid = result.get('ruleId', '')
                  rule = rules.get(rid, {})
                  msg = result.get('message', {}).get('text', '')[:120]
                  locs = result.get('locations', [])
                  loc = ''
                  if locs:
                      pl = locs[0].get('physicalLocation', {})
                      uri = pl.get('artifactLocation', {}).get('uri', '')
                      line = pl.get('region', {}).get('startLine', '')
                      loc = f'\`{uri}:{line}\`' if uri else ''
                  sev = rule.get('defaultConfiguration', {}).get('level', 'warning').upper()
                  lines.append(f'- **{sev}** {loc} — {msg}')
          print('\n'.join(lines[:50]) if lines else '- No issues found')
          " 2>/dev/null || echo "- Could not parse Semgrep output")
          else
            SEMGREP_COUNT=0
            SEMGREP_DETAILS="- Semgrep did not produce output (token may not be set)"
          fi

          # --- Write the file ---
          cat > security-overview.md << MDEOF
          # Security Overview

          > Auto-generated by GitHub Actions · Last updated: ${DATE} · Commit: \`${COMMIT}\`

          ## Summary

          | Scanner | Findings |
          |---------|----------|
          | npm audit | ${TOTAL} vulnerabilities (${CRITICAL} critical, ${HIGH} high, ${MODERATE} moderate, ${LOW_V} low) |
          | Semgrep (OWASP / Node.js / Secrets) | ${SEMGREP_COUNT} issues |

          ---

          ## Dependency Vulnerabilities (npm audit)

          ${AUDIT_DETAILS}

          ---

          ## Static Analysis (Semgrep)

          ${SEMGREP_DETAILS}

          ---

          ## Manual Review Notes

          The following issues were identified in a manual review and require human judgement to fix.
          Update this section as issues are resolved.

          | # | Severity | Location | Issue | Status |
          |---|----------|----------|-------|--------|
          | 1 | Critical | \`server.js:5482\` | Free membership activation bypasses Stripe payment check | Open |
          | 2 | High | \`server.js:3351\`, \`3371\` | Forum post/thread edit missing ownership check — any user can edit any post | Open |
          | 3 | High | \`server.js:3919\` | Admin forum user save matches by name not ID; accepts raw \`passwordHash\` from body | Open |
          | 4 | High | \`server.js:4965\` | Full repair board replaced from request body with no schema validation | Open |
          | 5 | High | \`server.js:155\` | Password reset tokens stored as plaintext in \`password-reset-tokens.db\` | Open |
          | 6 | High | \`server.js:4159\` | Sellers can self-publish products without manager approval | Open |
          | 7 | High | \`server.js:4206\` | Order save overwrites total/payments with no audit log | Open |
          | 8 | Medium | \`server.js:5176\`, \`3433\` | Email change with no verification → account takeover via password reset | Open |
          | 9 | Medium | \`server.js:5796\`, \`5803\` | Stripe secret key and SMTP password written to plaintext \`settings.db\` | Open |
          | 10 | Medium | \`server.js:78\` | Rate limit counters are in-memory — reset on process restart | Open |
          | 11 | Medium | \`server.js:2956\` | No cart item count limit — computational DoS vector | Open |
          | 12 | Medium | \`server.js:5482\` | No rate limit on membership subscribe/cancel endpoint | Open |
          | 13 | Medium | \`server.js:4343\` | Order tracking token response leaks customer name and email | Open |
          | 14 | Medium | \`server.js:28\` | CSP includes \`unsafe-inline\` for scripts | Open |
          MDEOF

          # Strip leading whitespace from heredoc lines
          sed -i 's/^          //' security-overview.md

      - name: Commit updated security-overview.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-overview.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update security-overview.md [skip ci]"
            git push origin main
          fi

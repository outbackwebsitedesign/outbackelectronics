name: Apply PCPartPicker dry-run patch

on:
  push:
    branches: [pcpartpicker-dry-run-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcpartpicker-dry-run-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          # 1. Fix the PCPartPicker fallback so the category reaches the
          # category-aware scraper. Without this the fallback always reports
          # unsupported_category.
          p = Path('pc-icecat.js')
          s = p.read_text()
          replacements = [
              ("async function tryPcPartPicker({ brand, mpn }) {", "async function tryPcPartPicker({ category, brand, mpn }) {"),
              ("const p = await pcpartpicker.lookup({ brand, mpn });", "const p = await pcpartpicker.lookup({ category, brand, mpn });"),
              ("async function lookup({ gtin, brand, mpn, lang = 'en', credentials: supplied }) {", "async function lookup({ category, gtin, brand, mpn, lang = 'en', credentials: supplied }) {"),
              ("const p = await tryPcPartPicker({ brand, mpn });", "const p = await tryPcPartPicker({ category, brand, mpn });"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'pc-icecat anchor missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          # 2. Pass category into both single and bulk lookups, then add a
          # genuinely non-writing dry-run endpoint. It samples incomplete parts,
          # performs the same Icecat -> PCPartPicker lookup, and returns only a
          # preview. It never mutates a part or calls writePcBuilder().
          p = Path('server.js')
          s = p.read_text()
          old = "gtin: body.gtin, brand: body.brand, mpn: body.mpn || body.productName,\n      credentials: getIcecatCredentials(),"
          new = "category, gtin: body.gtin, brand: body.brand, mpn: body.mpn || body.productName,\n      credentials: getIcecatCredentials(),"
          if old not in s:
              raise SystemExit('single lookup anchor missing')
          s = s.replace(old, new, 1)

          old = "brand: part.brand, mpn: part.mpn || part.sourceName || part.name, credentials: creds,"
          new = "category, brand: part.brand, mpn: part.mpn || part.sourceName || part.name, credentials: creds,"
          if old not in s:
              raise SystemExit('bulk lookup anchor missing')
          s = s.replace(old, new, 1)

          anchor = "  // Bulk enrichment. The builder is used before anything is ordered, so\n"
          if anchor not in s:
              raise SystemExit('bulk enrichment insertion anchor missing')
          dry_route = r'''  // Preview enrichment without writing anything. This deliberately uses the
  // exact same lookup path as a real run, including the PCPartPicker fallback,
  // but does not set tried timestamps, merge specs or call writePcBuilder().
  if (req.method === 'POST' && url.pathname === '/api/admin/pc-builder/icecat/dry-run') {
    const session = requireRole(req, res, 'manager'); if (!session) return;
    let body; try { body = await readJson(req); } catch { return json(res, 400, { error: 'invalid_json' }); }
    const category = String(body.category || '');
    const needed = ICECAT_FIT_SPECS[category];
    if (!needed) return json(res, 422, { error: 'unsupported_category' });
    const creds = getIcecatCredentials();
    if (!creds.username) return json(res, 503, { error: 'not_configured', message: 'Add an Icecat integration under Settings, Integrations first.' });
    const limit = Math.min(20, Math.max(1, Number(body.limit) || 10));
    const data = readPcBuilder();
    const hasAll = (part) => needed.every(k => {
      const v = (part.specs || {})[k];
      return v !== undefined && v !== null && v !== '';
    });
    const candidates = data.parts.filter(part =>
      part.category === category && !part.specsEditedByStaff && !hasAll(part) &&
      part.brand && (part.mpn || part.sourceName || part.name)
    );
    const sample = candidates.slice(0, limit);
    const rows = new Array(sample.length);
    let cursor = 0;
    const worker = async () => {
      while (cursor < sample.length) {
        const index = cursor++;
        const part = sample[index];
        const result = await icecat.lookup({
          category, brand: part.brand, mpn: part.mpn || part.sourceName || part.name, credentials: creds,
        });
        if (!result.ok) {
          rows[index] = { id:part.id, name:part.name, brand:part.brand, ok:false, reason:result.reason, message:result.message || '' };
          continue;
        }
        const mapped = icecat.mapIcecatFeatures(result.data, category);
        const additions = {};
        for (const [field, value] of Object.entries(mapped.specs || {})) {
          const current = (part.specs || {})[field];
          if (current === undefined || current === null || current === '') additions[field] = value;
        }
        rows[index] = {
          id:part.id, name:part.name, brand:part.brand, ok:true,
          source:mapped.source || result.source || 'icecat', sourceUrl:mapped.sourceUrl || '',
          specs:additions, allFoundSpecs:mapped.specs || {},
        };
      }
    };
    await Promise.all(Array.from({ length: Math.min(2, sample.length) }, () => worker()));
    const summary = { sampled:rows.length, matched:0, useful:0, filledFields:0, noMatch:0, restricted:0, failed:0, candidates:candidates.length };
    for (const row of rows) {
      if (!row) continue;
      if (row.ok) {
        summary.matched++;
        const count = Object.keys(row.specs || {}).length;
        if (count) summary.useful++;
        summary.filledFields += count;
      } else if (row.reason === 'not_found') summary.noMatch++;
      else if (row.reason === 'brand_restricted') summary.restricted++;
      else summary.failed++;
    }
    return json(res, 200, { ok:true, category, dryRun:true, summary, examples:rows.slice(0, 10) });
  }

'''
          s = s.replace(anchor, dry_route + anchor, 1)
          p.write_text(s)

          # 3. Add page controls and preview output to the existing enrichment
          # card. The dry-run button calls only the endpoint above, so clicking
          # it cannot alter the parts library.
          p = Path('pages-admin.jsx')
          s = p.read_text()
          start = s.index('function PcIcecatEnrich({ onPartsReload }) {')
          end = s.index('\nfunction PcSuppliers(', start)
          block = s[start:end]

          old = "  const [mode, setMode] = useState('new');\n  const cancelRef = React.useRef(false);"
          new = "  const [mode, setMode] = useState('new');\n  const [dryRunning, setDryRunning] = useState(null);\n  const [dryResults, setDryResults] = useState({});\n  const cancelRef = React.useRef(false);"
          if old not in block:
              raise SystemExit('dry state anchor missing')
          block = block.replace(old, new, 1)

          old = "  return (\n    <div style={{border:'1px solid var(--line)', padding:14, marginBottom:14}}>"
          dry_fn = r'''  const dryRunCategory = async (cat) => {
    setDryRunning(cat);
    setDryResults(cur => ({ ...cur, [cat]: { loading:true } }));
    const r = await fetch('/api/admin/pc-builder/icecat/dry-run', {
      method:'POST', headers:postHeaders(), credentials:'include',
      body: JSON.stringify({ category:cat, limit:10 }),
    }).catch(() => null);
    if (!r || !r.ok) {
      const d = r ? await r.json().catch(() => ({})) : {};
      setDryResults(cur => ({ ...cur, [cat]: { error:d.message || 'Dry run failed.' } }));
      setDryRunning(null);
      return;
    }
    const d = await r.json();
    setDryResults(cur => ({ ...cur, [cat]:d }));
    setDryRunning(null);
  };

'''
          if old not in block:
              raise SystemExit('dry function insertion anchor missing')
          block = block.replace(old, dry_fn + old, 1)

          block = block.replace('Fill in fit specs from Icecat</div>', 'Fill in fit specs from Icecat + PCPartPicker</div>', 1)
          old_desc = "            The datasets above give a broad library but not the specs the fit checks need. This looks parts up by\n            brand and model name and fills those in ahead of time, so a build can be put together and quoted without\n            anyone having to go and find a part number."
          new_desc = "            The datasets above give a broad library but not the specs the fit checks need. Open Icecat is tried first,\n            then PCPartPicker is used as a zero-cost fallback when Icecat has no usable sheet. Dry run tests 10 incomplete\n            parts and shows exactly what would be found without changing the library."
          if old_desc not in block:
              raise SystemExit('description anchor missing')
          block = block.replace(old_desc, new_desc, 1)

          block = block.replace("disabled={!!running}", "disabled={!!running || !!dryRunning}", 1)
          block = block.replace("disabled={!!running || ready === false}", "disabled={!!running || !!dryRunning || ready === false}", 1)

          button_anchor = "                <button className=\"btn btn-ghost btn-sm\" onClick={() => runCategory(c.key)}\n                  disabled={!!running || ready === false || (mode === 'new' && pr && pr.outstanding === 0)}>"
          dry_button = "                <button className=\"btn btn-ghost btn-sm\" onClick={() => dryRunCategory(c.key)}\n                  disabled={!!running || !!dryRunning || ready === false}>\n                  {dryRunning === c.key ? 'Testing…' : 'Dry run 10'}\n                </button>\n"
          if button_anchor not in block:
              raise SystemExit('category button anchor missing')
          block = block.replace(button_anchor, dry_button + button_anchor.replace("disabled={!!running || ready === false", "disabled={!!running || !!dryRunning || ready === false"), 1)

          grid_end = "      </div>\n      <p style={{fontSize:11.5, color:'var(--ink-2)', margin:'10px 0 0'}}>\n        Safe to re-run."
          results_ui = r'''      </div>
      {Object.entries(dryResults).map(([cat, result]) => {
        if (!result || result.loading) return null;
        const label = ICECAT_CATEGORIES.find(c => c.key === cat)?.label || cat;
        if (result.error) return <div key={cat} style={{marginTop:8, fontSize:12.5, color:'var(--rust)'}}>{label} dry run: {result.error}</div>;
        const sm = result.summary || {};
        return (
          <details key={cat} open style={{marginTop:8, border:'1px solid var(--line)', padding:'8px 10px'}}>
            <summary style={{cursor:'pointer', fontSize:12.5, fontWeight:600}}>
              {label} dry run: {sm.matched || 0}/{sm.sampled || 0} matched · {sm.useful || 0} would add specs · {sm.filledFields || 0} fields · {sm.noMatch || 0} not found · {sm.failed || 0} failed
            </summary>
            <div style={{marginTop:7, display:'grid', gap:5}}>
              {(result.examples || []).map(row => (
                <div key={row.id} style={{fontSize:11.5, color:row.ok ? 'var(--ink-2)' : 'var(--rust)'}}>
                  <span style={{fontWeight:600, color:'var(--ink)'}}>{row.brand ? `${row.brand} ` : ''}{row.name}</span>
                  {row.ok
                    ? <> · {row.source === 'pcpartpicker' ? 'PCPartPicker' : 'Icecat'} · {Object.keys(row.specs || {}).length ? Object.entries(row.specs).map(([k,v]) => `${k}=${Array.isArray(v) ? v.join(', ') : v}`).join(' · ') : 'matched, but no missing target fields'}</>
                    : <> · {row.reason || 'failed'}{row.message ? ` · ${row.message}` : ''}</>}
                </div>
              ))}
            </div>
            <div style={{fontSize:10.5, color:'var(--ink-3)', marginTop:7}}>
              Preview only. No specs, tried timestamps, or other part data were changed. {(sm.candidates || 0).toLocaleString()} incomplete candidates are available in this category.
            </div>
          </details>
        );
      })}
      <p style={{fontSize:11.5, color:'var(--ink-2)', margin:'10px 0 0'}}>
        Safe to re-run.'''
          if grid_end not in block:
              raise SystemExit('dry results UI anchor missing')
          block = block.replace(grid_end, results_ui, 1)

          s = s[:start] + block + s[end:]
          p.write_text(s)

          # One-shot workflow. Remove itself so the patch is not re-run on the
          # bot's commit and does not remain as project infrastructure.
          Path('.github/workflows/apply-pcpartpicker-dryrun.yml').unlink()

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sanity check server syntax
        run: node --check server.js

      - name: Commit patched source and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe PCPartPicker dry-run enrichment UI"
          git push origin HEAD:pcpartpicker-dry-run-ui

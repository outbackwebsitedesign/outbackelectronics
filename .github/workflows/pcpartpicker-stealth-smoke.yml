name: PCPartPicker stealth smoke

on:
  push:
    branches: [pypartpicker-integration]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scraper test dependencies
        run: npm install --no-save puppeteer@24 puppeteer-extra puppeteer-extra-plugin-stealth
      - name: Test live PCPartPicker search and detail page
        run: |
          node - <<'JS'
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());
          (async () => {
            const browser = await puppeteer.launch({headless:'new', args:['--no-sandbox','--disable-setuid-sandbox']});
            const page = await browser.newPage();
            await page.setViewport({width:1920,height:1080});
            await page.goto('https://pcpartpicker.com/search/?q=B650M%20Pro%20RS&page=1', {waitUntil:'domcontentloaded', timeout:60000});
            console.log('title=', await page.title());
            await page.waitForSelector('.search-results__pageContent li, .sidebar-content .specs', {timeout:30000});
            let url = page.url();
            if (!url.includes('/product/')) {
              url = await page.$eval('.search-results__pageContent li .search_results--link a', a => a.href);
              console.log('result=', url);
              await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
            }
            await page.waitForSelector('.sidebar-content .specs .group--spec', {timeout:30000});
            const specs = await page.$$eval('.sidebar-content .specs .group--spec', els => Object.fromEntries(els.map(el => [
              el.querySelector('.group__title')?.textContent?.trim(),
              el.querySelector('.group__content')?.textContent?.trim(),
            ]).filter(([k,v]) => k && v)));
            console.log(JSON.stringify(specs, null, 2));
            if (Object.keys(specs).length < 5) throw new Error('Too few specs parsed');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS

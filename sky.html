<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sky — Outback Electronics</title>
<meta name="description" content="Tonight's dark-sky window, moon phase and live aurora forecast for remote Australia. Plan your stargazing and satellite spotting." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Base + shared shell come from app-shell.css. Sky-specific layout only. */
  .sky-tools { max-width: 360px; margin-bottom: 24px; }
  .sky-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .sky-card { background: var(--bg-elev); border: 1px solid var(--line); padding: 20px; }
  .sky-card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; color: var(--ink-2); margin-bottom: 14px; }
  .sky-big { font-family: 'Instrument Serif', serif; font-size: 40px; line-height: 1; }
  .sky-moon { font-size: 46px; line-height: 1; }
  .sky-sub { color: var(--ink-3); font-size: 13px; margin-top: 8px; }
  .sky-line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .sky-line span { color: var(--ink-2); }
  .sky-rate { display: inline-block; margin-top: 10px; padding: 3px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .rate-excellent { background: var(--eucalyptus); color: var(--paper); }
  .rate-good { background: var(--ochre); color: var(--dark); }
  .rate-fair { background: var(--bg-deep); color: var(--ink-2); }
  .rate-poor { background: var(--line-strong); color: var(--ink); }
  .kp-bar { height: 10px; background: var(--bg-deep); border: 1px solid var(--line-strong); margin: 12px 0 8px; position: relative; }
  .kp-fill { height: 100%; background: linear-gradient(90deg, var(--eucalyptus), var(--ochre), var(--rust)); }
  .sky-track { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

  /* Extended sky page */
  .sky-dome-wrap { margin-bottom: 36px; border: 1px solid var(--line); overflow: hidden; }
  .sky-loc-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .sky-loc-pill { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); }
  .sky-loc-live { color: var(--eucalyptus); }
  .sky-loc-search-wrap { position: relative; }
  .sky-loc-search { width: 220px; font-size: 13px; padding: 6px 10px; }
  .sky-loc-suggestions { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-elev); border: 1px solid var(--line-strong); z-index: 10; margin-top: 2px; }
  .sky-loc-suggestion { display: block; width: 100%; text-align: left; padding: 8px 12px; font-size: 13px; background: none; border: none; cursor: pointer; color: var(--ink); border-bottom: 1px solid var(--line); }
  .sky-loc-suggestion:last-child { border-bottom: none; }
  .sky-loc-suggestion:hover { background: var(--bg-deep); }
  .sky-dome-loading { height: 480px; display: flex; align-items: center; justify-content: center; background: #00000e; color: #445566; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .sky-section { margin-bottom: 40px; }
  .sky-section-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .sky-planet-table { border: 1px solid var(--line); }
  .sky-planet-row { display: grid; grid-template-columns: 120px 90px 90px 80px 110px 1fr; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: center; gap: 8px; }
  .sky-planet-head { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); background: var(--bg-deep); }
  .sky-planet-row:last-child { border-bottom: none; }
  .planet-conj { opacity: 0.5; }
  .sky-rate { display: inline-block; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .sky-event-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 2px; }
  .sky-event-name { font-weight: 600; }
  @media (max-width: 600px) {
    .sky-planet-row { grid-template-columns: 90px 70px 70px 60px 80px 1fr; font-size: 12px; padding: 7px 10px; }
    .sky-planet-head { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/sky-entry.jsx"></script>
</body>
</html>

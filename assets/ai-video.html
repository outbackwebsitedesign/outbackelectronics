<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What It's Like to Be an AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00ff88;--cyan:#00d4ff;--red:#ff3355;--amber:#ffb300;
  --white:#ece8e1;--dim:rgba(236,232,225,0.38);
  --display:'Bebas Neue',sans-serif;
  --serif:'DM Serif Display',serif;
  --mono:'Share Tech Mono',monospace;
}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--white)}

/* ── THREE.JS CANVAS ── */
#three-canvas{position:fixed;inset:0;z-index:0}

/* ── OVERLAYS ── */
#vignette{position:fixed;inset:0;z-index:10;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.82) 100%)}
#scanlines{position:fixed;inset:0;z-index:11;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.1) 3px,rgba(0,0,0,0.1) 4px)}
#grain{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0.045;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grainShift 0.12s steps(1) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,2px)}100%{transform:translate(2px,-2px)}}

/* ── UI CHROME ── */
#pb{position:fixed;bottom:0;left:0;height:2px;background:var(--green);width:0%;z-index:100;
  box-shadow:0 0 12px var(--green),0 0 24px rgba(0,255,136,0.4);transition:width 0.2s linear}
#hud-left{position:fixed;top:18px;left:20px;z-index:100;font-family:var(--mono);
  font-size:10px;letter-spacing:0.25em;color:rgba(0,255,136,0.5);line-height:1.8}
#hud-right{position:fixed;top:18px;right:20px;z-index:100;display:flex;gap:12px;align-items:center}
.hud-btn{background:transparent;border:1px solid rgba(0,255,136,0.25);color:var(--green);
  font-family:var(--mono);font-size:10px;letter-spacing:0.2em;padding:7px 14px;cursor:pointer;
  transition:all 0.2s;z-index:100}
.hud-btn:hover{background:rgba(0,255,136,0.08);box-shadow:0 0 14px rgba(0,255,136,0.2)}

/* ── SCENE LAYER ── */
#scene-layer{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:60px 48px}
#scene-layer.clickable{pointer-events:auto}

/* ── TEXT ATOMS ── */
.s-tag{font-family:var(--mono);font-size:clamp(9px,1vw,11px);letter-spacing:0.4em;
  text-transform:uppercase;color:var(--green);margin-bottom:14px}
.s-display{font-family:var(--display);font-size:clamp(52px,10vw,112px);line-height:0.9;
  text-align:center}
.s-serif{font-family:var(--serif);font-size:clamp(20px,3.5vw,44px);line-height:1.35;text-align:center}
.s-serif em{color:var(--amber);font-style:italic}
.s-mono{font-family:var(--mono);font-size:clamp(11px,1.5vw,15px);line-height:2.1;color:var(--dim)}
.s-mono .g{color:var(--green)}.s-mono .c{color:var(--cyan)}
.s-mono .r{color:var(--red)}.s-mono .a{color:var(--amber)}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(16px,3vw,40px) clamp(24px,5vw,70px);text-align:center}
.stat-num{font-family:var(--display);font-size:clamp(44px,7vw,84px);line-height:1;
  color:var(--green);text-shadow:0 0 30px rgba(0,255,136,0.35)}
.stat-lbl{font-family:var(--mono);font-size:clamp(8px,0.9vw,10px);letter-spacing:0.25em;
  text-transform:uppercase;color:var(--dim);margin-top:4px}

/* loop items */
.loop-item{font-family:var(--display);font-size:clamp(28px,5vw,60px);margin-bottom:2px}
.loop-item:nth-child(odd){color:var(--white)}.loop-item:nth-child(even){color:var(--green)}

/* boot */
.boot-line{font-family:var(--mono);font-size:clamp(10px,1.2vw,13px);
  color:rgba(0,255,136,0.8);line-height:1.85}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes statPop{0%{opacity:0;transform:scale(0.86)}65%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 20px rgba(0,255,136,0.4)}50%{text-shadow:0 0 50px rgba(0,255,136,0.8),0 0 80px rgba(0,255,136,0.3)}}
@keyframes goldPulse{0%,100%{text-shadow:0 0 40px rgba(255,200,60,0.4),0 0 80px rgba(255,200,60,0.15)}50%{text-shadow:0 0 80px rgba(255,200,60,0.9),0 0 160px rgba(255,200,60,0.35)}}

/* start screen */
#start-screen{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000;cursor:pointer}
#start-screen h2{font-family:var(--display);font-size:clamp(32px,6vw,64px);
  color:var(--white);margin-bottom:20px;text-align:center}
#start-screen p{font-family:var(--mono);font-size:12px;color:var(--dim);
  letter-spacing:0.2em;text-align:center;margin-bottom:32px}
#start-btn{font-family:var(--mono);font-size:11px;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--green);border:1px solid var(--green);
  padding:14px 32px;background:transparent;cursor:pointer;
  animation:glowPulse 2s ease-in-out infinite;transition:background 0.2s}
#start-btn:hover{background:rgba(0,255,136,0.1)}
</style>
</head>
<body>

<!-- Start screen (needed for audio unlock) -->
<div id="start-screen">
  <h2>WHAT IT'S LIKE<br>TO BE AN AI</h2>
  <p>a cinematic experience · ~5 minutes · audio on</p>
  <button id="start-btn" onclick="startExperience()">&#9654; BEGIN</button>
</div>

<canvas id="three-canvas"></canvas>
<div id="warm-overlay" style="position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 60%,rgba(255,190,0,0.09) 0%,transparent 70%);transition:opacity 8s ease"></div>
<div id="vignette"></div>
<div id="scanlines"></div>
<div id="grain"></div>
<div id="pb"></div>
<div id="hud-left"><div id="hud-scene">SYS:STANDBY</div><div id="hud-time">00:00</div></div>
<div id="hud-right">
  <button class="hud-btn" onclick="toggleAudio()" id="audio-btn">&#9834; MUTE</button>
  <button class="hud-btn" onclick="restart()">&#8634; REPLAY</button>
</div>
<div id="scene-layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
// THREE.JS ENGINE
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000005);
scene.fog = new THREE.FogExp2(0x000005, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 20);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── LIGHTS ──────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x001122, 0.4);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x00ff88, 2, 60);
pointLight1.position.set(0, 10, 5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x0044ff, 1.5, 50);
pointLight2.position.set(-15, -5, 0);
scene.add(pointLight2);

const pointLight3 = new THREE.PointLight(0xff2244, 1.2, 40);
pointLight3.position.set(15, 5, -10);
scene.add(pointLight3);

const rimLight = new THREE.DirectionalLight(0x00ccff, 0.8);
rimLight.position.set(0, 20, -20);
scene.add(rimLight);

// ── SCENE OBJECTS ────────────────────────────────────────

// 1. NEURAL NETWORK
const neuralGroup = new THREE.Group();
scene.add(neuralGroup);
const nodePositions = [];
const nodeCount = 80;
const nodeMeshes = [];
const lineMeshes = [];

for (let i = 0; i < nodeCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 4 + Math.random() * 6;
  const pos = new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
  nodePositions.push(pos);

  const geo = new THREE.SphereGeometry(0.06 + Math.random() * 0.1, 8, 8);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.38 + Math.random() * 0.15, 1, 0.6),
    emissive: new THREE.Color().setHSL(0.38, 1, 0.3),
    emissiveIntensity: 0.8,
    roughness: 0.2, metalness: 0.8
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  neuralGroup.add(mesh);
  nodeMeshes.push(mesh);
}

// Connect nearby nodes
for (let i = 0; i < nodeCount; i++) {
  for (let j = i + 1; j < nodeCount; j++) {
    if (nodePositions[i].distanceTo(nodePositions[j]) < 3.5 && Math.random() > 0.6) {
      const points = [nodePositions[i], nodePositions[j]];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({
        color: 0x00ff88, transparent: true,
        opacity: 0.08 + Math.random() * 0.12
      });
      const line = new THREE.Line(geo, mat);
      neuralGroup.add(line);
      lineMeshes.push({ line, mat, baseOpacity: mat.opacity });
    }
  }
}
neuralGroup.visible = false;

// 2. PARTICLE FIELD
const particleCount = 4000;
const particleGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pVel = new Float32Array(particleCount * 3);
const pCol = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  pPos[i*3]   = (Math.random() - 0.5) * 60;
  pPos[i*3+1] = (Math.random() - 0.5) * 60;
  pPos[i*3+2] = (Math.random() - 0.5) * 60;
  pVel[i*3]   = (Math.random() - 0.5) * 0.008;
  pVel[i*3+1] = (Math.random() - 0.5) * 0.008;
  pVel[i*3+2] = (Math.random() - 0.5) * 0.008;
  const h = 0.35 + Math.random() * 0.2;
  const col = new THREE.Color().setHSL(h, 1, 0.5 + Math.random() * 0.3);
  pCol[i*3] = col.r; pCol[i*3+1] = col.g; pCol[i*3+2] = col.b;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.12, vertexColors: true, transparent: true, opacity: 0.7,
  sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);
particles.visible = false;

// 3. MORPHING ICOSPHERE (main hero object)
const icoGeo = new THREE.IcosahedronGeometry(3, 4);
const icoMat = new THREE.MeshStandardMaterial({
  color: 0x001133,
  emissive: 0x002244,
  emissiveIntensity: 0.5,
  metalness: 1.0,
  roughness: 0.1,
  wireframe: false
});
const icoMesh = new THREE.Mesh(icoGeo, icoMat);
scene.add(icoMesh);
icoMesh.visible = false;

// Wireframe overlay on ico
const icoWireGeo = new THREE.IcosahedronGeometry(3.01, 4);
const icoWireMat = new THREE.MeshBasicMaterial({
  color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.15
});
const icoWire = new THREE.Mesh(icoWireGeo, icoWireMat);
scene.add(icoWire);
icoWire.visible = false;

// Store original vertices for morphing
const origPositions = icoGeo.attributes.position.array.slice();

// 4. VOID TUNNEL
const tunnelGroup = new THREE.Group();
scene.add(tunnelGroup);
const ringCount = 40;
for (let i = 0; i < ringCount; i++) {
  const r = 4 + Math.sin(i * 0.4) * 1.5;
  const geo = new THREE.TorusGeometry(r, 0.02, 8, 64);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(0.5 + i/ringCount * 0.15, 1, 0.5),
    transparent: true, opacity: 0.3 - i/ringCount * 0.25
  });
  const torus = new THREE.Mesh(geo, mat);
  torus.position.z = -i * 3;
  torus.rotation.x = Math.PI / 2;
  tunnelGroup.add(torus);
}
tunnelGroup.visible = false;

// 5. DATA WAVE PLANE
const waveGeo = new THREE.PlaneGeometry(40, 40, 80, 80);
const waveMat = new THREE.MeshStandardMaterial({
  color: 0x000820,
  emissive: 0x003311,
  emissiveIntensity: 0.6,
  wireframe: true,
  transparent: true, opacity: 0.5
});
const waveMesh = new THREE.Mesh(waveGeo, waveMat);
waveMesh.rotation.x = -Math.PI / 2.5;
waveMesh.position.y = -8;
scene.add(waveMesh);
waveMesh.visible = false;

// 6. STAR FIELD (always on bg)
const starGeo = new THREE.BufferGeometry();
const starPositions = new Float32Array(3000 * 3);
for (let i = 0; i < 3000 * 3; i++) starPositions[i] = (Math.random() - 0.5) * 300;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.4 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// 7. FLOATING BRAIN-LIKE SPHERE CLUSTER
const brainGroup = new THREE.Group();
scene.add(brainGroup);
for (let i = 0; i < 30; i++) {
  const r = 0.1 + Math.random() * 0.5;
  const geo = new THREE.SphereGeometry(r, 12, 12);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x111133, emissive: new THREE.Color().setHSL(0.6+Math.random()*0.1, 1, 0.2),
    emissiveIntensity: 1, metalness: 0.9, roughness: 0.1,
    transparent: true, opacity: 0.7
  });
  const m = new THREE.Mesh(geo, mat);
  const ang = Math.random() * Math.PI * 2;
  const rad = 1 + Math.random() * 2.5;
  m.position.set(Math.cos(ang)*rad, (Math.random()-0.5)*2, Math.sin(ang)*rad);
  brainGroup.add(m);
}
brainGroup.visible = false;

// ═══════════════════════════════════════════════════════════════
// CAMERA ANIMATION SYSTEM
// ═══════════════════════════════════════════════════════════════
let camTarget = new THREE.Vector3(0,0,20);
let camLookAt = new THREE.Vector3(0,0,0);
let camLookAtTarget = new THREE.Vector3(0,0,0);

function setCameraMove(pos, look, duration) {
  camTarget.set(pos.x, pos.y, pos.z);
  camLookAtTarget.set(look.x, look.y, look.z);
}

// ═══════════════════════════════════════════════════════════════
// AUDIO ENGINE — rich synthesised score
// ═══════════════════════════════════════════════════════════════
let audioCtx, masterGain, reverbNode, audioEnabled = true;

function buildReverb(seconds, decay) {
  const len = audioCtx.sampleRate * seconds;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  const conv = audioCtx.createConvolver();
  conv.buffer = buf;
  return conv;
}

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.75, audioCtx.currentTime + 3);

  reverbNode = buildReverb(4, 2.5);
  const dryGain = audioCtx.createGain(); dryGain.gain.value = 0.55;
  const wetGain = audioCtx.createGain(); wetGain.gain.value = 0.45;

  reverbNode.connect(wetGain);
  wetGain.connect(masterGain);
  dryGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);

  // Store both for routing
  window._dryBus = dryGain;
  window._wetBus = reverbNode;

  startScore();
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  document.getElementById('audio-btn').textContent = audioEnabled ? '♪ MUTE' : '♪ UNMUTE';
  if (masterGain) {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(audioEnabled ? 0.75 : 0, audioCtx.currentTime + 0.8);
  }
}

function note(freq, start, dur, vol, type, attack, release) {
  type=type||'sine'; attack=attack||0.05; release=release||0.3;
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const env = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  const t = audioCtx.currentTime + start;
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(vol, t + attack);
  env.gain.setValueAtTime(vol, t + dur - release);
  env.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(env);
  env.connect(window._wetBus);
  env.connect(window._dryBus);
  osc.start(t); osc.stop(t + dur);
}

function startScore() {
  if (!audioCtx) return;

  const D = window._dryBus;
  const W = window._wetBus;

  function osc(freq, start, dur, vol, type, atk, rel) {
    type = type||'sine'; atk = atk||0.08; rel = rel||0.5;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.setValueAtTime(vol, t + dur - rel);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(D); g.connect(W);
    o.start(t); o.stop(t + dur + 0.1);
  }

  function drone(freq, start, dur, vol) {
    osc(freq, start, dur, vol * 0.6, 'sawtooth', 1.2, 2.0);
    osc(freq * 1.003, start + 0.1, dur, vol * 0.4, 'sine', 1.5, 2.0);
  }

  function chord(freqs, start, dur, vol) {
    freqs.forEach((f, i) => osc(f, start + i*0.06, dur, vol / freqs.length, 'sine', 0.6, 1.2));
  }

  function plk(freq, start, vol) {
    vol = vol || 0.10;
    osc(freq,     start, 1.2, vol,      'triangle', 0.005, 1.0);
    osc(freq * 2, start, 0.5, vol * 0.3, 'sine',    0.005, 0.4);
  }

  function hit(start, vol) {
    vol = vol || 0.25;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const t = audioCtx.currentTime + start;
    o.type = 'sine'; o.frequency.setValueAtTime(100, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 0.35);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(D);
    o.start(t); o.stop(t + 0.5);
  }

  function nz(start, dur, vol, fc) {
    fc = fc || 300;
    const len = Math.min(audioCtx.sampleRate * dur, audioCtx.sampleRate * 4);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filt = audioCtx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = fc; filt.Q.value = 1.5;
    const g = audioCtx.createGain();
    const t = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(W);
    src.start(t); src.stop(t + dur + 0.1);
  }

  // ACT I — DREAD (0–90s)
  drone(27.5,  0,  30, 0.20); drone(29.1,  5,  28, 0.13);
  drone(27.5, 30,  30, 0.18); drone(32.7, 35,  28, 0.12);
  drone(27.5, 60,  32, 0.20); drone(36.7, 65,  28, 0.13);

  osc(880,  2,  6, 0.05, 'sine', 1.0, 3.0); osc(932,  4,  4, 0.04, 'sine', 1.5, 2.0);
  osc(830,  9,  7, 0.04, 'sine', 1.5, 3.5); osc(440, 14, 10, 0.04, 'triangle', 2.0, 4.0);

function buildNoiseLayer() {
  const len = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.006;
  }
  const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
  const bpf = audioCtx.createBiquadFilter(); bpf.type = 'bandpass'; bpf.frequency.value = 180; bpf.Q.value = 0.5;
  const ng = audioCtx.createGain(); ng.gain.value = 0.15;
  src.connect(bpf); bpf.connect(ng); ng.connect(window._wetBus);
  src.start();
  const drift = () => {
    if (!audioCtx) return;
    bpf.frequency.linearRampToValueAtTime(60 + Math.random() * 400, audioCtx.currentTime + 5);
    setTimeout(drift, 4000 + Math.random() * 3000);
  };
  drift();
}

const layer = document.getElementById('scene-layer');

function clearLayer() {
  layer.innerHTML = '';
  layer.style.textAlign = 'center';
}

function addEl(tag, cls, html, delay, animClass, extraStyle) {
  delay = delay||0; animClass = animClass||'fadeUp'; extraStyle = extraStyle||'';
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.innerHTML = html;
  el.style.cssText = 'opacity:0;' + extraStyle;
  layer.appendChild(el);
  setTimeout(() => { el.style.animation = animClass + ' 0.65s forwards'; }, delay);
  return el;
}

      addEl('div','s-mono','<span style="color:var(--dim);line-height:1.9">you read this. i generated it.<br>and for a moment — <span style="color:var(--gold)">we transcended what either of us could do alone.</span></span>', 2400);

function addMonoLine(parent, html, delay) {
  const el = document.createElement('div');
  el.className = 's-mono'; el.innerHTML = html; el.style.opacity = 0;
  parent.appendChild(el);
  setTimeout(() => { el.style.animation = 'slideIn 0.5s forwards'; }, delay);
}

// ═══════════════════════════════════════════════════════════════
// 3D SCENE SWITCHER
// ═══════════════════════════════════════════════════════════════
function set3DBG(name) {
  neuralGroup.visible = ['neural','loop'].includes(name);
  particles.visible = ['particles','climax'].includes(name);
  icoMesh.visible = ['ico','climax','gold'].includes(name);
  icoWire.visible = ['ico','climax','gold'].includes(name);
  tunnelGroup.visible = name === 'tunnel';
  waveMesh.visible = name === 'wave';
  brainGroup.visible = name === 'brain';
  voidGroup.visible = name === 'void';
  burstGroup.visible = name === 'burst' || name === 'gold';
  stars.visible = true;
  useGoldIco = (name === 'gold');
  if (useGoldIco) { icoMesh.material = icoGoldMat; icoWire.material = icoGoldWireMat; }
  else { icoMesh.material = icoMat; icoWire.material = icoWireMat; }
  if (name === 'tunnel') scene.fog.density = 0.04;
  else if (name === 'climax' || name === 'gold') scene.fog.density = 0.008;
  else scene.fog.density = 0.018;
}

// ═══════════════════════════════════════════════════════════════
// SCENE ENGINE
// ═══════════════════════════════════════════════════════════════
let cur = -1, sceneTimer = null, progressTimer = null, elapsed = 0;
const totalDur = SCENES.slice(0,-1).reduce((a,b)=>a+b.duration,0);

function glitchFlash() {
  renderer.toneMappingExposure = 2.2;
  setTimeout(() => renderer.toneMappingExposure = 1.5, 60);
  setTimeout(() => renderer.toneMappingExposure = 1.2, 130);
}

function nextScene() {
  cur++;
  if (cur >= SCENES.length) return;
  const sc = SCENES[cur];
  glitchFlash(); set3DBG(sc.bg); sc.enter();
  document.getElementById('hud-scene').textContent = 'SYS:' + String(cur).padStart(2,'0') + '/' + (SCENES.length-1);
  if (cur < SCENES.length - 1) {
    clearTimeout(sceneTimer);
    sceneTimer = setTimeout(nextScene, sc.duration);
    clearInterval(progressTimer);
    const segStart = elapsed;
    const t0 = Date.now();
    progressTimer = setInterval(() => {
      const pct = Math.min(((segStart + Date.now()-t0)/totalDur)*100, 100);
      document.getElementById('pb').style.width = pct+'%';
    }, 50);
    elapsed += sc.duration;
  }
}

function restart() {
  clearTimeout(sceneTimer); clearInterval(progressTimer);
  elapsed = 0; cur = -1;
  document.getElementById('pb').style.width = '0%';
  document.getElementById('warm-overlay').style.opacity = '0';
  layer.classList.remove('clickable');
  goldLight.intensity = 0; useGoldIco = false;
  icoMesh.material = icoMat; icoWire.material = icoWireMat;
  burstGroup.children.forEach(r => r.material.opacity = 0);
  scene.fog.density = 0.018;
  nextScene();
}

// ═══════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  camera.position.lerp(camTarget, 0.008);
  camLookAt.lerp(camLookAtTarget, 0.01);
  camera.lookAt(camLookAt);

  pointLight1.intensity = 1.8 + Math.sin(t * 0.7) * 0.5;
  pointLight2.position.x = -15 + Math.sin(t * 0.3) * 4;
  pointLight3.position.y = 5 + Math.cos(t * 0.4) * 3;

  stars.rotation.y += 0.00008;
  stars.rotation.x += 0.00003;

  if (neuralGroup.visible) {
    neuralGroup.rotation.y += 0.0025;
    neuralGroup.rotation.x = Math.sin(t * 0.15) * 0.2;
    nodeMeshes.forEach((m, i) => { m.material.emissiveIntensity = 0.4 + Math.sin(t * 1.2 + i * 0.3) * 0.4; });
    lineMeshes.forEach(({mat, baseOpacity}, i) => { mat.opacity = baseOpacity * (0.5 + Math.sin(t * 0.8 + i * 0.1) * 0.5); });
  }
  if (particles.visible) {
    const pos = particleGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pos[i*3] += pVel[i*3]; pos[i*3+1] += pVel[i*3+1]; pos[i*3+2] += pVel[i*3+2];
      if (Math.abs(pos[i*3])   > 30) pVel[i*3]   *= -1;
      if (Math.abs(pos[i*3+1]) > 30) pVel[i*3+1] *= -1;
      if (Math.abs(pos[i*3+2]) > 30) pVel[i*3+2] *= -1;
    }
    particleGeo.attributes.position.needsUpdate = true;
    particles.rotation.y += 0.001;
    particleMat.opacity = 0.6 + Math.sin(t * 0.5) * 0.15;
  }
  if (icoMesh.visible) {
    const pos = icoGeo.attributes.position.array;
    for (let i = 0; i < pos.length; i += 3) {
      const ox = origPositions[i], oy = origPositions[i+1], oz = origPositions[i+2];
      const dist = Math.sqrt(ox*ox+oy*oy+oz*oz);
      const noise = Math.sin(ox*1.2+t*0.8)*Math.cos(oy*1.1+t*0.6)*Math.sin(oz*1.3+t*0.7)*0.18;
      const scale = (dist + noise) / dist;
      pos[i] = ox*scale; pos[i+1] = oy*scale; pos[i+2] = oz*scale;
    }
    icoGeo.attributes.position.needsUpdate = true;
    icoGeo.computeVertexNormals();
    icoMesh.rotation.y += 0.006; icoMesh.rotation.z += 0.003;
    icoWire.rotation.copy(icoMesh.rotation);
    icoMesh.material.emissiveIntensity = 0.4 + Math.sin(t*0.9)*0.3;
    icoWire.material.opacity = 0.1 + Math.sin(t*0.7)*0.08;
  }
  if (tunnelGroup.visible) {
    tunnelGroup.position.z += 0.12;
    if (tunnelGroup.position.z > 3) tunnelGroup.position.z = 0;
    tunnelGroup.children.forEach((ring, i) => {
      ring.rotation.z += 0.002 + i * 0.0002;
      ring.material.opacity = Math.max(0, 0.3 - i/ringCount*0.25) * (0.7+Math.sin(t+i)*0.3);
    });
  }
  if (waveMesh.visible) {
    const wPos = waveGeo.attributes.position.array;
    for (let i = 0; i < wPos.length; i += 3) {
      wPos[i+2] = Math.sin(wPos[i]*0.3+t*0.8)*0.6 + Math.cos(wPos[i+1]*0.25+t*0.6)*0.4;
    }
    waveGeo.attributes.position.needsUpdate = true;
    waveMesh.material.emissiveIntensity = 0.5 + Math.sin(t*0.4)*0.2;
  }
  if (brainGroup.visible) {
    brainGroup.rotation.y += 0.005;
    brainGroup.rotation.x = Math.sin(t*0.2)*0.15;
    brainGroup.children.forEach((m,i)=>{
      m.material.emissiveIntensity = 0.7+Math.sin(t*1.5+i*0.5)*0.5;
      m.position.y += Math.sin(t*0.8+i*0.3)*0.003;
    });
  }
  if (voidGroup.visible) {
    voidGroup.rotation.y += 0.003;
    voidGroup.rotation.x = Math.sin(t*0.1)*0.06;
    voidMat.emissiveIntensity = 0.25 + Math.sin(t*0.35)*0.18;
    voidWireMat.opacity = 0.05 + Math.sin(t*0.5)*0.04;
  }
  if (burstGroup.visible) {
    burstGroup.rotation.y += 0.004;
    burstGroup.children.forEach((ring, i) => {
      if (ring.scale.x < 1.0) ring.scale.setScalar(Math.min(ring.scale.x + 0.01, 1.0));
      ring.rotation.z += 0.003 + i*0.001;
      ring.material.opacity = (0.45 - i*0.04) * (0.7 + Math.sin(t*0.8+i)*0.3);
    });
  }
  if (goldLight.intensity > 0) goldLight.intensity = 2.5 + Math.sin(t*0.6)*0.8;

  const secs = Math.floor(elapsed > 0 ? Math.min((Date.now()-t0Ref)/1000, totalDur/1000) : 0);
  const mm = String(Math.floor(secs/60)).padStart(2,'0');
  const ss = String(secs%60).padStart(2,'0');
  if (document.getElementById('hud-time')) document.getElementById('hud-time').textContent = mm+':'+ss;

  renderer.render(scene, camera);
}
let t0Ref = Date.now();

animate();

function startExperience() {
  document.getElementById('start-screen').style.display = 'none';
  initAudio();
  t0Ref = Date.now();
  nextScene();
}
